# Manual check: a missing parameter leaves the default untouched.
# Writes %LOCALAPPDATA%\borc-check\base.txt always, and greeting.txt only when
# the greeting parameter is given.
#
# Layout under BORC_SETTINGS: none.
borc:
  description: borc manual check for parameters
  parameters:
    greeting: text written to greeting.txt (optional)
$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  winget:
    processor: dscv3
resources:
  - name: base file
    type: Microsoft.DSC.Transitional/PowerShellScript
    properties:
      input: base.txt
      testScript: |
        param($file)
        Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA "borc-check\$file")
      setScript: |
        param($file)
        New-Item -ItemType Directory -Path (Join-Path $env:LOCALAPPDATA 'borc-check') -Force | Out-Null
        Set-Content -LiteralPath (Join-Path $env:LOCALAPPDATA "borc-check\$file") -Value 'base'
  - name: greeting file
    type: Microsoft.DSC.Transitional/PowerShellScript
    properties:
      input: '{{greeting}}'
      testScript: |
        param($text)
        $path = Join-Path $env:LOCALAPPDATA 'borc-check\greeting.txt'
        (Test-Path -LiteralPath $path) -and ((Get-Content -LiteralPath $path -Raw).Trim() -eq $text)
      setScript: |
        param($text)
        New-Item -ItemType Directory -Path (Join-Path $env:LOCALAPPDATA 'borc-check') -Force | Out-Null
        Set-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'borc-check\greeting.txt') -Value $text
