# Manual check: an elevated Windows PowerShell 5.1 unit reads a secret.
# Writes only whether the secret was found, never its value.
#
# Layout under BORC_SETTINGS: none.
borc:
  description: borc manual check for secrets and elevation
  secrets: [BORC_CHECK_SECRET]
$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  winget:
    processor: dscv3
resources:
  - name: read secret elevated
    type: Microsoft.DSC.Transitional/WindowsPowerShellScript
    metadata:
      securityContext: elevated
    properties:
      input: secret.txt
      testScript: |
        param($file)
        Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA "borc-check\$file")
      setScript: |
        param($file)
        . "$env:LOCALAPPDATA\borc\Get-BorcSecret.ps1"
        $found = [bool](Get-BorcSecret BORC_CHECK_SECRET)
        $elevated = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
        New-Item -ItemType Directory -Path (Join-Path $env:LOCALAPPDATA 'borc-check') -Force | Out-Null
        Set-Content -LiteralPath (Join-Path $env:LOCALAPPDATA "borc-check\$file") -Value "found=$found elevated=$elevated"
