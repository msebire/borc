# Test fixture, not a real recipe.
# Layout under BORC_SETTINGS: none.
borc:
  description: Node.js LTS with an optional npm cache and prefix
  parameters:
    npmCache: npm cache location (optional)
    npmPrefix: npm global prefix (optional)
$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  winget:
    processor: dscv3
resources:
  - name: node package
    type: Microsoft.WinGet/Package
    properties:
      id: OpenJS.NodeJS.LTS
      source: winget
  - name: npm cache
    type: Microsoft.DSC.Transitional/PowerShellScript
    properties:
      input: '{{npmCache}}'
      testScript: |
        param($path)
        (npm config get cache) -eq $path
      setScript: |
        param($path)
        npm config set cache $path
  - name: npm prefix
    type: Microsoft.DSC.Transitional/PowerShellScript
    properties:
      input: '{{npmPrefix}}'
      testScript: |
        param($path)
        (npm config get prefix) -eq $path
      setScript: |
        param($path)
        npm config set prefix $path
