# Test fixture, not a real recipe.
# Layout under BORC_SETTINGS:
#   idea/            IntelliJ IDEA config folder (idea.config.path)
borc:
  description: IntelliJ IDEA Community with its settings in BORC_SETTINGS
$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  winget:
    processor: dscv3
resources:
  - name: idea package
    type: Microsoft.WinGet/Package
    properties:
      id: JetBrains.IntelliJIDEA.Community
      source: winget
  - name: idea config path
    type: Microsoft.DSC.Transitional/PowerShellScript
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package','idea package')]"
    properties:
      input: idea
      testScript: |
        param($folder)
        $env:IDEA_PROPERTIES -eq (Join-Path $env:BORC_SETTINGS "$folder\idea.properties")
      setScript: |
        param($folder)
        [Environment]::SetEnvironmentVariable('IDEA_PROPERTIES', (Join-Path $env:BORC_SETTINGS "$folder\idea.properties"), 'User')
